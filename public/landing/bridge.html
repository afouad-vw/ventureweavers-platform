<!doctype html><meta charset="utf-8"><title>bridge</title>
<script>
// TEMPORARY helper for regenerating landing scenes in Google AI Studio: on request, sends a landing image to the parent page.
addEventListener('message', async (e) => {
  if (e.origin !== 'https://aistudio.google.com' || !e.data || !e.data.vwget) return;
  const { name, maxW, type } = e.data;
  if (!/^[a-z0-9-]+\.(webp|png|jpg)$/.test(name)) return;
  const img = new Image(); img.src = '/landing/' + name; await img.decode();
  const s = Math.min(1, (maxW || 99999) / img.naturalWidth);
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, type || 'image/png', 0.95));
  e.source.postMessage({ vwimg: true, name, blob, w: c.width, h: c.height }, e.origin);
});
parent.postMessage({ vwready: true }, 'https://aistudio.google.com');
</script>
